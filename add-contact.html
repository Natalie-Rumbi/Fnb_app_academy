<html>
    <head>
        <meta charset="UTF-8">
        <title></title>
    </head>
    <body>
        <br/>
        <form id="editForm">
            <label for="firstname">First name</label>
            <input type="text" name="firstname" id="firstname"><br/>
            <label for="lastname">Last name</label>
            <input type="text" name="lastname" id="lastname"><br/>
            <label for="mobile">Mobile</label>
            <input type="text" name="mobile" id="mobile"><br/>
            <label for="email">Email</label>
            <input type="text" name="email" id="email"><br/>
            <label for="avatar">Select a File</label><br/>
            <input type="file" name="avatar" id="avatar"><br/>
            <button type="submit" id="submitForm">Submit</button>
            </form>
            <br/>
            <button id="homeLink" type="button">Home</button>

            <script src="config.js"></script>
            <script>
                document.getElementById("submitForm").addEventListener('click', submitForm);
                document.getElementById("homeLink").addEventListener('click', homeLink);
                


                function submitForm(e){
                    e.preventDefault();  //preventing the reloading of the form when they have submitted the info

                    const form = new FormData(document.querySelector('#editForm'));  //formData object, we put the id for the form
                    form.append('apiKey', apiKey); 
                    
                    fetch(rootPath + 'controller/insert-contact/',{
                        method: 'POST',
                        headers: {'Accept': 'aplication/json, *.*'},
                        body: form

                    })
                    .then(function(response){
                        return response.text();
                    })

                    .then(function(data){
                        if(data =="1"){
                            alert("Contact added.");
                            homeLink();
                        }else{
                            alert(data);
                            homeLink();
                        }
                    })

                }

                function homeLink(){
                    window.open("index.html", "_self"); //abuilt in js function that opens up a window, so _self ensures that it does not open a new tab but that everything happens within the same tab
                }

                function addContact(){
                    window.open("add-contact.html", "_self");
                }

                
            </script>
    </body>
</html>
