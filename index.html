<html>
    <head>
        <meta charset="UTF-8">
        <title>Contact Book</title>
    </head>
    <body onload="fetchContacts()">
        <div id="table">Contacts Loading...</div>
        <button id="refresh" type="button" onclick="fetchContacts()">Refresh</button>
        <button id="addContact" type="button" onclick="window.open('add-contact.html', '_self')">Add Contact</button>

        <script src="config.js"></script>
        <script>
            document.getElementById("refresh").addEventListener('click', fetchContacts);

            document.getElementById("addContact").addEventListener("click", function() {
                window.open("add-contact.html", "_self");
            });
            
            function fetchContacts(){
                fetch(rootPath + "controller/get-contacts/?apiKey=" + apiKey)
                .then(function(response){
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data){
                    displayOutput(data);
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    document.getElementById("table").innerHTML = "Error loading contacts";
                });
            }

            function displayOutput(data){
                let output = "<table border='1'>";
                
                for(let a in data){
                    output += `
                        <tr onclick="editContact(${data[a].id})">
                            <td><img src="${rootPath}controller/uploads/${data[a].avatar}" width="40"/></td>
                            <td><h5>${data[a].firstname}</h5></td>
                            <td><h5>${data[a].lastname}</h5></td>
                        </tr>
                    `;
                }
                output += "</table>";
                document.getElementById("table").innerHTML = output;
            }

            function editContact(id){
                window.open("edit-contact.html?id=" + id, "_self");
            }
        </script>
    </body>
</html>
